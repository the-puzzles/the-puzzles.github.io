<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mancala</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="common.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="netplay.js"></script>
<style>
:root {
  --pit: clamp(58px, calc((100vw - 64px) / 2), 84px);
  --store-h: clamp(46px, calc(var(--pit) * 0.78), 64px);
  --board-w: calc(var(--pit) * 2 + 8px);
  --net-btn-bg: #2a1705; --net-btn-border: #d97706; --net-btn-color: #fbbf24;
}

body {
  padding: 16px 16px 48px;
  user-select: none;
  -webkit-user-select: none;
}

.top-bar { max-width: 560px; }

/* ── Title ───────────────────────────────────────────────────────── */
h1 {
  font-size: 2.6rem; font-weight: 900; letter-spacing: 0.14em;
  margin-bottom: 24px; text-align: center; line-height: 1;
  background: linear-gradient(135deg, #d97706, #0d9488);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

/* ── Score bar ───────────────────────────────────────────────────── */
.score-bar {
  display: flex;
  width: min(var(--board-w) + 120px, 92vw);
  background: #161b22; border: 1px solid #21262d;
  border-radius: 14px; overflow: hidden; margin-bottom: 14px;
}
.score-item {
  flex: 1; padding: 12px 8px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  position: relative; transition: background 0.2s;
}
.score-item + .score-item { border-inline-start: 1px solid #21262d; }
.score-item::after {
  content: ''; position: absolute; bottom: 0; left: 12px; right: 12px;
  height: 3px; border-radius: 2px 2px 0 0;
  transform: scaleX(0); transition: transform 0.25s ease;
}
.score-p1.active  { background: rgba(217,119,6,0.08); }
.score-p1.active::after { background: #d97706; transform: scaleX(1); }
.score-p2.active  { background: rgba(13,148,136,0.08); }
.score-p2.active::after { background: #0d9488; transform: scaleX(1); }

.score-label { font-size: 0.68rem; color: #6e7681; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
.score-val   { font-size: 2rem; font-weight: 800; line-height: 1; min-width: 1.2ch; text-align: center; }
.score-p1    .score-val { color: #f59e0b; }
.score-draw  .score-val { color: #6e7681; }
.score-p2    .score-val { color: #2dd4bf; }

/* ── Status ──────────────────────────────────────────────────────── */
.status {
  font-size: 1.05rem; font-weight: 700; color: #c9d1d9;
  margin-bottom: 14px;
  gap: 6px; letter-spacing: 0.01em;
}
.status.won-p1 { color: #f59e0b; }
.status.won-p2 { color: #2dd4bf; }
.status.draw   { color: #8b949e; }

.turn-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  animation: pulse 1.4s ease infinite;
}
.turn-dot.dot-p1 { background: #f59e0b; }
.turn-dot.dot-p2 { background: #2dd4bf; }
@keyframes pulse {
  0%,100% { opacity: 1;   transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.65); }
}

/* ── Board ───────────────────────────────────────────────────────── */
.board {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
  padding: 16px 14px;
  border-radius: 24px;
  background:
    repeating-linear-gradient(4deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 1px, transparent 1px, transparent 5px),
    repeating-linear-gradient(4deg, rgba(255,214,160,0.07) 0px, rgba(255,214,160,0.07) 1px, transparent 1px, transparent 13px),
    repeating-linear-gradient(-3deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 21px),
    radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,0.06), transparent 60%),
    linear-gradient(170deg, #5c3c22, #3d2716 55%, #4c3119);
  border: 1px solid #402813;
  box-shadow: 0 12px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
}

.store {
  width: var(--board-w);
  height: var(--store-h);
  border-radius: calc(var(--store-h) / 2);
  background: linear-gradient(180deg, #241206, #1a0d04);
  border: 2px solid #3a2410;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 4px 8px;
  position: relative;
  overflow: hidden;
  transition: box-shadow 0.2s, border-color 0.2s;
}
.store-p1 { border-color: #7c4a10; }
.store-p2 { border-color: #0f5c52; }
.store.active-store { box-shadow: 0 0 0 2px currentColor inset; }
.store-p1.active-store { color: #f59e0b; }
.store-p2.active-store { color: #2dd4bf; }
.store-info {
  display: flex; align-items: center; gap: 8px;
  position: relative; z-index: 1;
  background: rgba(8,5,2,0.72);
  border-radius: 999px;
  padding: 3px 12px;
}
.store-val { font-size: 1.5rem; font-weight: 800; }
.store-p1 .store-val { color: #f59e0b; }
.store-p2 .store-val { color: #2dd4bf; }
.store-arrow { font-size: 0.8rem; color: #6e7681; }

.store-beads {
  position: absolute; inset: 0; pointer-events: none;
}
.store-beads .bead {
  position: absolute;
  width: calc(var(--store-h) * 0.17); height: calc(var(--store-h) * 0.17);
  margin: calc(var(--store-h) * -0.085);
  border-radius: 50%;
  opacity: 0.8;
  transition: left 0.25s ease, top 0.25s ease;
}
.store-p1 .store-beads .bead { background: radial-gradient(circle at 30% 25%, #ffe4b5, #f59e0b 55%, #92400e 100%); }
.store-p2 .store-beads .bead { background: radial-gradient(circle at 30% 25%, #cffafe, #2dd4bf 55%, #0f5c52 100%); }

.pits {
  display: grid;
  grid-template-columns: repeat(2, var(--pit));
  grid-template-rows: repeat(6, var(--pit));
  gap: 8px;
}

.pit {
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #2a1a0c, #150c04);
  border: 2px solid #3a2410;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: default;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
  font-size: calc(var(--pit) * 0.34);
  font-weight: 800;
  color: #d6c2a3;
}
.pit.row-p2 { border-color: #0f5c52; }
.pit.row-p1 { border-color: #7c4a10; }

.pit.clickable { cursor: pointer; }
.pit.clickable:hover { background: radial-gradient(circle at 35% 30%, #3a2610, #1e1206); transform: translateY(-1px); }
.pit.empty { color: #4a4038; }

.pit.sowing { animation: sowPop 0.28s ease; }
@keyframes sowPop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.22); }
  100% { transform: scale(1); }
}

.beads {
  position: absolute; inset: 8%;
  border-radius: 50%;
  overflow: hidden;
  pointer-events: none;
}
.bead {
  position: absolute;
  width: 0.62em; height: 0.62em;
  margin: -0.31em;
  border-radius: 50%;
  box-shadow: 0 1px 1.5px rgba(0,0,0,0.5);
  transition: left 0.25s ease, top 0.25s ease;
}
.pit.row-p1 .bead { background: radial-gradient(circle at 30% 25%, #ffe4b5, #f59e0b 55%, #92400e 100%); }
.pit.row-p2 .bead { background: radial-gradient(circle at 30% 25%, #cffafe, #2dd4bf 55%, #0f5c52 100%); }

.pit-count {
  position: absolute; bottom: 5%; right: 8%;
  font-size: calc(var(--pit) * 0.22); font-weight: 800; color: #f0e6d2;
  background: rgba(10,6,2,0.6);
  border-radius: 6px; padding: 0 0.3em; line-height: 1.5;
  pointer-events: none;
}

.pit.last-landed.row-p1 { box-shadow: 0 0 0 2px #f59e0b, 0 0 14px 2px rgba(245,158,11,0.5); }
.pit.last-landed.row-p2 { box-shadow: 0 0 0 2px #2dd4bf, 0 0 14px 2px rgba(45,212,191,0.5); }

.won-p1 .store-p1, .won-p1 .pit.row-p1 { box-shadow: 0 0 0 2px #f59e0b, 0 0 14px 2px rgba(245,158,11,0.5); }
.won-p2 .store-p2, .won-p2 .pit.row-p2 { box-shadow: 0 0 0 2px #2dd4bf, 0 0 14px 2px rgba(45,212,191,0.5); }

/* ── Mode bar ────────────────────────────────────────────────────── */
.mode-bar {
  display: flex; gap: 6px; margin-bottom: 20px; justify-content: center;
  width: min(var(--board-w) + 120px, 92vw); flex-wrap: wrap;
}
.mode-btn {
  background: #161b22; border: 1px solid #30363d; color: #8b949e;
  border-radius: 20px; padding: 6px 14px; font-size: 0.82rem;
  font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.15s;
}
.mode-btn:hover:not(.active) { border-color: #6e7681; color: #c9d1d9; }
.mode-btn.active { background: #2a1705; border-color: #d97706; color: #fbbf24; }

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn-row { display: flex; gap: 10px; }
.new-game-btn {
  background: #2a1705; border: 1px solid #d97706; color: #fbbf24;
  border-radius: 10px; padding: 11px 40px; font-size: 0.92rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
  transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s; letter-spacing: 0.04em;
}
.new-game-btn:hover  { opacity: 0.85; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(217,119,6,0.25); }
.new-game-btn:active { transform: translateY(0); box-shadow: none; }
.reset-scores-btn {
  background: none; border: 1px solid #30363d; color: #6e7681;
  border-radius: 10px; padding: 11px 14px; font-size: 0.9rem;
  font-family: inherit; cursor: pointer; transition: color 0.15s, border-color 0.15s;
}
.reset-scores-btn:hover { color: #c9d1d9; border-color: #6e7681; }

@media (max-width: 480px) {
  h1 { font-size: 2rem; }
}
</style>
</head>
<body>
<div id="app" v-cloak>

  <div class="top-bar">
    <a class="back-link" href="index.html">{{ UI.back }}</a>
    <div class="lang-toggle">
      <button class="lang-btn" :class="{active: lang==='en'}" @click="setLang('en')">EN</button>
      <button class="lang-btn" :class="{active: lang==='he'}" @click="setLang('he')">עב</button>
      <button class="lang-btn" :class="{active: lang==='es'}" @click="setLang('es')">ES</button>
    </div>
  </div>

  <h1>{{ UI.title }}</h1>

  <div class="score-bar" dir="ltr">
    <div class="score-item score-p1" :class="{active: phase==='playing' && turn===1 && !aiThink}">
      <div class="score-label">{{ UI.p1 }}</div>
      <div class="score-val">{{ scores[0] }}</div>
    </div>
    <div class="score-item score-draw">
      <div class="score-label">{{ UI.draws }}</div>
      <div class="score-val">{{ scores[2] }}</div>
    </div>
    <div class="score-item score-p2" :class="{active: phase==='playing' && turn===2 && !aiThink}">
      <div class="score-label">{{ UI.p2 }}</div>
      <div class="score-val">{{ scores[1] }}</div>
    </div>
  </div>

  <net-panel v-if="mode === 'net'"></net-panel>

  <div class="status" :class="statusClass">
    <template v-if="mode === 'net' && netCtrl.netStatus !== 'connected'"></template>
    <template v-else-if="phase === 'playing'">
      <template v-if="extraTurnFlash">
        <span :style="{color: turn===1?'#f59e0b':'#2dd4bf'}">{{ turn===1 ? UI.p1 : UI.p2 }}</span>
        <span>{{ UI.extraTurn }}</span>
      </template>
      <template v-else-if="isRTL">
        <span v-if="!aiThink" class="turn-dot" :class="turn===1?'dot-p1':'dot-p2'"></span>
        <span>{{ aiThink ? UI.thinking : UI.turnWord }}</span>
        <span :style="{color: turn===1?'#f59e0b':'#2dd4bf'}">{{ turn===1 ? UI.p1 : UI.p2 }}</span>
      </template>
      <template v-else>
        <span v-if="!aiThink" class="turn-dot" :class="turn===1?'dot-p1':'dot-p2'"></span>
        <span :style="{color: turn===1?'#f59e0b':'#2dd4bf'}">{{ turn===1 ? UI.p1 : UI.p2 }}</span>
        <span>{{ aiThink ? UI.thinking : UI.turnWord }}</span>
      </template>
    </template>
    <template v-else-if="phase === 'won'">
      <template v-if="isRTL">
        <span>{{ UI.wonVerb }}</span>
        <span>{{ winner===1 ? UI.p1 : UI.p2 }}</span>
        <span>🎉</span>
      </template>
      <template v-else>
        <span>{{ winner===1 ? UI.p1 : UI.p2 }}</span>
        <span>{{ UI.wonVerb }}</span>
        <span>🎉</span>
      </template>
    </template>
    <template v-else-if="phase === 'draw'">{{ UI.draw }}</template>
  </div>

  <div class="board" dir="ltr" :class="phase !== 'playing' ? statusClass : ''">
    <div class="store store-p2" :class="{'active-store': phase==='playing' && turn===2 && !aiThink}">
      <div class="store-beads">
        <span v-for="(pos, bi) in storeSeedPositions(board[13])" :key="bi" class="bead" :style="{ left: pos.x + '%', top: pos.y + '%' }"></span>
      </div>
      <div class="store-info">
        <div class="store-arrow">▲</div>
        <div class="store-val">{{ board[13] }}</div>
      </div>
    </div>

    <div class="pits">
      <div
        v-for="i in boardOrder"
        :key="i"
        class="pit"
        :class="[
          i <= 5 ? 'row-p1' : 'row-p2',
          {
            clickable: canClick(i),
            empty: board[i] === 0,
            sowing: sowingSet.has(i),
            'last-landed': lastLanded === i,
          },
        ]"
        @click="clickPit(i)"
      >
        <div class="beads">
          <span v-for="(pos, bi) in seedPositions(board[i])" :key="bi" class="bead" :style="{ left: pos.x + '%', top: pos.y + '%' }"></span>
        </div>
        <span class="pit-count" v-if="board[i] > 0">{{ board[i] }}</span>
      </div>
    </div>

    <div class="store store-p1" :class="{'active-store': phase==='playing' && turn===1 && !aiThink}">
      <div class="store-beads">
        <span v-for="(pos, bi) in storeSeedPositions(board[6])" :key="bi" class="bead" :style="{ left: pos.x + '%', top: pos.y + '%' }"></span>
      </div>
      <div class="store-info">
        <div class="store-arrow">▼</div>
        <div class="store-val">{{ board[6] }}</div>
      </div>
    </div>
  </div>

  <div class="mode-bar">
    <button class="mode-btn" :class="{active: mode==='2p'}"     @click="setMode('2p')">{{ UI.mode2p }}</button>
    <button class="mode-btn" :class="{active: mode==='easy'}"   @click="setMode('easy')">{{ UI.modeEasy }}</button>
    <button class="mode-btn" :class="{active: mode==='medium'}" @click="setMode('medium')">{{ UI.modeMedium }}</button>
    <button class="mode-btn" :class="{active: mode==='hard'}"   @click="setMode('hard')">{{ UI.modeHard }}</button>
    <button class="mode-btn" :class="{active: mode==='net'}"    @click="setMode('net')">{{ UI.modeNet }}</button>
  </div>

  <div class="btn-row">
    <button class="new-game-btn" @click="newGame">{{ UI.newGame }}</button>
    <button class="reset-scores-btn" @click="resetScores" :title="UI.resetScores">↺</button>
  </div>

</div>
<script>
const { createApp, ref, computed, provide, watchEffect } = Vue;

const STRINGS = {
  title:       { en: 'MANCALA',       he: 'מנקלה',            es: 'MANCALA' },
  back:        { en: 'All Games',     he: 'כל המשחקים',        es: 'Todos los juegos' },
  p1:          { en: 'Amber',         he: 'ענבר',              es: 'Ámbar' },
  p2:          { en: 'Teal',          he: 'טורקיז',            es: 'Turquesa' },
  draws:       { en: 'Draws',         he: 'תיקו',              es: 'Empates' },
  wonVerb:     { en: 'wins!',         he: 'ניצח!',             es: '¡gana!' },
  turnWord:    { en: "'s turn",       he: 'תור',               es: 'turno' },
  extraTurn:   { en: 'goes again!',   he: 'משחק שוב!',         es: '¡juega otra vez!' },
  draw:        { en: "It's a draw!",  he: 'תיקו!',             es: '¡Empate!' },
  thinking:    { en: 'Thinking…',     he: 'חושב…',             es: 'Pensando…' },
  newGame:     { en: 'New Game',      he: 'משחק חדש',         es: 'Nueva partida' },
  resetScores: { en: 'Reset scores',  he: 'אפס ניקוד',        es: 'Reiniciar puntos' },
  mode2p:      { en: '👥 2 Players',  he: '👥 2 שחקנים',      es: '👥 2 Jugadores' },
  modeEasy:    { en: '🤖 Easy',       he: '🤖 קל',             es: '🤖 Fácil' },
  modeMedium:  { en: '🤖 Medium',     he: '🤖 בינוני',         es: '🤖 Medio' },
  modeHard:    { en: '🤖 Hard',       he: '🤖 קשה',            es: '🤖 Difícil' },
  modeNet:     { en: '🌐 Network',    he: '🌐 רשת',            es: '🌐 Red' },
};

const SEEDS_PER_PIT = 4;
const P1_STORE = 6, P2_STORE = 13;
const P1_RANGE = [0, 5], P2_RANGE = [7, 12];
const STEP_MS = 130;

function makeInitialBoard() {
  const b = Array(14).fill(SEEDS_PER_PIT);
  b[P1_STORE] = 0; b[P2_STORE] = 0;
  return b;
}

function ownRange(player)  { return player === 1 ? P1_RANGE : P2_RANGE; }
function ownStore(player)  { return player === 1 ? P1_STORE : P2_STORE; }
function oppStore(player)  { return player === 1 ? P2_STORE : P1_STORE; }
function opposite(i)       { return 12 - i; }

function validMoves(board, player) {
  const [lo, hi] = ownRange(player);
  const moves = [];
  for (let i = lo; i <= hi; i++) if (board[i] > 0) moves.push(i);
  return moves;
}

// Resolves a full move: sowing, capture, extra-turn, and end-of-game sweep.
function applyMove(board, idx, player) {
  const b = [...board];
  let seeds = b[idx];
  b[idx] = 0;
  const path = [];
  let pos = idx;
  while (seeds > 0) {
    pos = (pos + 1) % 14;
    if (player === 1 && pos === P2_STORE) continue;
    if (player === 2 && pos === P1_STORE) continue;
    b[pos]++;
    seeds--;
    path.push(pos);
  }
  const last = pos;
  const [lo, hi] = ownRange(player);
  let extraTurn = false, captured = false;

  if (last === ownStore(player)) {
    extraTurn = true;
  } else if (last >= lo && last <= hi && b[last] === 1) {
    const opp = opposite(last);
    if (b[opp] > 0) {
      b[ownStore(player)] += b[last] + b[opp];
      b[last] = 0; b[opp] = 0;
      captured = true;
    }
  }

  const p1Empty = P1_RANGE[0] <= P1_RANGE[1] && b.slice(P1_RANGE[0], P1_RANGE[1] + 1).every(v => v === 0);
  const p2Empty = b.slice(P2_RANGE[0], P2_RANGE[1] + 1).every(v => v === 0);
  let finished = false;
  if (p1Empty || p2Empty) {
    finished = true;
    if (!p1Empty) for (let i = P1_RANGE[0]; i <= P1_RANGE[1]; i++) { b[P1_STORE] += b[i]; b[i] = 0; }
    if (!p2Empty) for (let i = P2_RANGE[0]; i <= P2_RANGE[1]; i++) { b[P2_STORE] += b[i]; b[i] = 0; }
  }

  return { board: b, path, last, extraTurn, captured, finished };
}

function storeDiff(board, player) {
  return player === 1 ? board[P1_STORE] - board[P2_STORE] : board[P2_STORE] - board[P1_STORE];
}
function seedDiff(board, player) {
  const [lo, hi] = ownRange(player), [olo, ohi] = ownRange(3 - player);
  let own = 0, opp = 0;
  for (let i = lo; i <= hi; i++) own += board[i];
  for (let i = olo; i <= ohi; i++) opp += board[i];
  return own - opp;
}
function evaluate(board, player) {
  return storeDiff(board, player) * 8 + seedDiff(board, player);
}

function minimax(board, player, depth, alpha, beta) {
  const moves = validMoves(board, player);
  if (!moves.length || depth === 0) return evaluate(board, player);

  let best = -Infinity;
  for (const idx of moves) {
    const { board: nb, extraTurn, finished } = applyMove(board, idx, player);
    let score;
    if (finished)          score = storeDiff(nb, player) * 1000;
    else if (extraTurn)    score = minimax(nb, player, depth - 1, alpha, beta);
    else                   score = -minimax(nb, 3 - player, depth - 1, -beta, -alpha);
    if (score > best) best = score;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

function pickBest(board, player, depth) {
  const moves = validMoves(board, player);
  let best = -Infinity, move = moves[0];
  for (const idx of moves) {
    const { board: nb, extraTurn, finished } = applyMove(board, idx, player);
    let score;
    if (finished)       score = storeDiff(nb, player) * 1000;
    else if (extraTurn) score = minimax(nb, player, depth - 1, -Infinity, Infinity);
    else                score = -minimax(nb, 3 - player, depth - 1, -Infinity, Infinity);
    if (score > best) { best = score; move = idx; }
  }
  return move;
}

function getRandomMove(board, player) {
  const moves = validMoves(board, player);
  return moves[Math.floor(Math.random() * moves.length)];
}
function getMediumMove(board, player) { return pickBest(board, player, 2); }
function getBestMove(board, player)   { return pickBest(board, player, 8); }

const PALETTES = {
  1: ['#f59e0b','#fbbf24','#d97706','#fcd34d','#fb923c'],
  2: ['#2dd4bf','#0d9488','#5eead4','#0891b2','#67e8f9'],
};

function launchFireworks(player) {
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:200;';
  cv.width = innerWidth; cv.height = innerHeight;
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  const cols = PALETTES[player];
  const ps = [];
  const burst = (x, y) => {
    for (let i = 0; i < 65; i++) {
      const a = Math.PI * 2 * i / 65, s = 2 + Math.random() * 6;
      ps.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s-2, alpha: 1,
        c: cols[~~(Math.random()*cols.length)], r: 2+Math.random()*3 });
    }
  };
  const end = Date.now() + 3000; let lb = 0;
  const frame = now => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (now - lb > 420 && Date.now() < end - 500) {
      burst(cv.width*(0.2+Math.random()*0.6), cv.height*(0.1+Math.random()*0.4)); lb = now;
    }
    for (const p of ps) {
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.alpha-=0.016;
      if (p.alpha <= 0) continue;
      ctx.globalAlpha = p.alpha; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ps.splice(0, ps.length, ...ps.filter(p => p.alpha > 0));
    if (Date.now() < end || ps.length) requestAnimationFrame(frame);
    else document.body.removeChild(cv);
  };
  burst(cv.width * 0.5, cv.height * 0.35);
  requestAnimationFrame(frame);
}

// Sunflower (phyllotaxis) packing so seed counts of any size fill a pit evenly.
const GOLDEN_ANGLE = 137.508 * Math.PI / 180;
function seedPositions(n) {
  const cap = Math.min(n, 40);
  const pts = [];
  for (let i = 0; i < cap; i++) {
    const r = Math.sqrt((i + 0.5) / cap) * 38;
    const theta = i * GOLDEN_ANGLE;
    pts.push({ x: 50 + r * Math.cos(theta), y: 50 + r * Math.sin(theta) });
  }
  return pts;
}
function storeSeedPositions(n) {
  const cap = Math.min(n, 24);
  const pts = [];
  for (let i = 0; i < cap; i++) {
    const r = Math.sqrt((i + 0.5) / cap);
    const theta = i * GOLDEN_ANGLE;
    pts.push({ x: 50 + r * Math.cos(theta) * 40, y: 50 + r * Math.sin(theta) * 30 });
  }
  return pts;
}

const SAVE_KEY = 'mancala-save';

createApp({
  components: { NetPanel },
  setup() {
    const lang    = ref('en');
    const mode    = ref('2p');
    const board   = ref(makeInitialBoard());
    const turn    = ref(1);
    const phase   = ref('playing');
    const winner  = ref(null);
    const aiThink = ref(false);
    const animating = ref(false);
    const sowingSet = ref(new Set());
    const lastLanded = ref(null);
    const extraTurnFlash = ref(false);

    const humanScores = ref([0, 0, 0]);
    const aiScores    = ref([0, 0, 0]);
    function scoresRef() { return (mode.value === '2p' || mode.value === 'net') ? humanScores : aiScores; }
    const scores = computed(() => scoresRef().value);

    // Interleaved [p1 pit, opposite p2 pit] per row so captures land side by side.
    const boardOrder = [0, 12, 1, 11, 2, 10, 3, 9, 4, 8, 5, 7];

    const netCtrl = createNetplay({
      gameId: 'mancala',
      onMove(data) {
        if (mode.value !== 'net') return;
        if (data.type === 'move' && phase.value === 'playing' && !animating.value) runMove(data.i, true);
        else if (data.type === 'newgame') resetBoard();
      },
      onReset: () => resetBoard(),
      onSync() { if (netCtrl.netStatus === 'connected') mode.value = 'net'; },
    });
    provide('_netplay', netCtrl);

    const isRTL = computed(() => lang.value === 'he');
    const UI    = computed(() => {
      const l = lang.value;
      return Object.fromEntries(Object.entries(STRINGS).map(([k, v]) => [k, v[l] ?? v.en]));
    });

    const statusClass = computed(() => {
      if (phase.value === 'won')  return winner.value === 1 ? 'won-p1' : 'won-p2';
      if (phase.value === 'draw') return 'draw';
      return '';
    });

    function canClick(i) {
      if (phase.value !== 'playing') return false;
      if (aiThink.value || animating.value) return false;
      if (board.value[i] <= 0) return false;
      const [lo, hi] = ownRange(turn.value);
      if (i < lo || i > hi) return false;
      if (mode.value === 'net') {
        if (netCtrl.netStatus !== 'connected') return false;
        return netCtrl.isMyTurn(turn.value);
      }
      if (mode.value !== '2p' && turn.value === 2) return false;
      return true;
    }

    function endGame(b) {
      const s = [...scoresRef().value];
      if (b[P1_STORE] > b[P2_STORE])      { phase.value = 'won'; winner.value = 1; s[0]++; launchFireworks(1); }
      else if (b[P2_STORE] > b[P1_STORE]) { phase.value = 'won'; winner.value = 2; s[1]++; launchFireworks(2); }
      else                                 { phase.value = 'draw'; s[2]++; }
      scoresRef().value = s;
      save();
    }

    function triggerAI(b, player) {
      if (mode.value === '2p' || mode.value === 'net' || player === 1) return;
      aiThink.value = true;
      setTimeout(() => {
        aiThink.value = false;
        const move = mode.value === 'hard'   ? getBestMove([...b], player)
                   : mode.value === 'medium' ? getMediumMove([...b], player)
                   :                           getRandomMove([...b], player);
        if (move !== undefined) runMove(move);
      }, 380);
    }

    function runMove(idx, remote = false) {
      const player = turn.value;
      const { board: finalBoard, path, last, extraTurn, finished } = applyMove(board.value, idx, player);

      if (!remote && mode.value === 'net') netCtrl.send({ type: 'move', i: idx });

      animating.value = true;
      lastLanded.value = null;
      const stepBoard = [...board.value];
      stepBoard[idx] = 0;
      board.value = [...stepBoard];

      path.forEach((pos, step) => {
        setTimeout(() => {
          stepBoard[pos]++;
          board.value = [...stepBoard];
          sowingSet.value = new Set([pos]);
        }, step * STEP_MS);
      });

      setTimeout(() => {
        sowingSet.value = new Set();
        board.value = finalBoard;
        lastLanded.value = last;
        animating.value = false;

        if (finished) {
          endGame(finalBoard);
          return;
        }

        if (extraTurn) {
          extraTurnFlash.value = true;
          setTimeout(() => { extraTurnFlash.value = false; }, 900);
          triggerAI(finalBoard, player);
        } else {
          turn.value = 3 - player;
          triggerAI(finalBoard, turn.value);
        }
        save();
      }, path.length * STEP_MS + 60);
    }

    function clickPit(i) {
      if (!canClick(i)) return;
      runMove(i);
    }

    function resetBoard() {
      board.value = makeInitialBoard();
      turn.value = 1;
      phase.value = 'playing';
      winner.value = null;
      aiThink.value = false;
      animating.value = false;
      sowingSet.value = new Set();
      lastLanded.value = null;
      extraTurnFlash.value = false;
    }

    function newGame() {
      resetBoard();
      save();
      if (mode.value === 'net') netCtrl.send({ type: 'newgame' });
    }

    function setMode(m) { mode.value = m; resetBoard(); save(); }
    function setLang(l) { lang.value = l; save(); }
    function resetScores() { humanScores.value = [0,0,0]; aiScores.value = [0,0,0]; save(); }

    function save() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          lang: lang.value,
          mode: mode.value === 'net' ? '2p' : mode.value,
          humanScores: humanScores.value,
          aiScores: aiScores.value,
        }));
      } catch (_) {}
    }

    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
        if (d.lang)        lang.value        = d.lang;
        const urlLang = new URLSearchParams(location.search).get('lang');
        if (urlLang && ["en","he","es"].includes(urlLang)) lang.value = urlLang;
        if (d.mode)        mode.value        = d.mode;
        if (d.humanScores) humanScores.value = d.humanScores;
        if (d.aiScores)    aiScores.value    = d.aiScores;
      } catch (_) {}
    }

    load();

    watchEffect(() => {
      document.documentElement.lang = lang.value;
      document.documentElement.dir = isRTL.value ? 'rtl' : 'ltr';
    });

    return {
      lang, mode, board, turn, phase, winner, aiThink, animating, sowingSet, lastLanded, extraTurnFlash,
      netCtrl, scores, boardOrder,
      isRTL, UI, statusClass,
      canClick, clickPit, newGame, setMode, setLang, resetScores,
      seedPositions, storeSeedPositions,
    };
  }
}).mount('#app');
</script>
