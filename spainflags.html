<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banderas — España</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="common.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
body { padding: 20px 16px 48px; }
#app { display: flex; flex-direction: column; align-items: center; width: 100%; }

.top-bar { max-width: 600px; }

h1 {
  font-size: 2rem; font-weight: 900; letter-spacing: .08em;
  background: linear-gradient(135deg, #e879f9, #a21caf);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 2px;
}
.tagline { color: #6e7681; font-size: .82rem; margin-bottom: 16px; text-align: center; }

.score-bar { display: flex; gap: 10px; margin-bottom: 14px; }
.score-item {
  background: #161b22; border: 1px solid #30363d; border-radius: 10px;
  padding: 6px 14px; min-width: 70px; text-align: center;
}
.score-label { font-size: .65rem; letter-spacing: .08em; text-transform: uppercase; color: #6e7681; }
.score-val { font-size: 1.2rem; font-weight: 800; }
.score-ok   .score-val { color: #e879f9; }
.score-help .score-val { color: #fbbf24; }
.score-miss .score-val { color: #f87171; }
.score-left .score-val { color: #8b949e; }

.mode-bar { display: flex; gap: 6px; margin-bottom: 14px; }
.mode-btn {
  background: none; border: 1px solid #30363d; color: #8b949e;
  border-radius: 8px; padding: 5px 12px; font-size: .78rem; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all .15s;
}
.mode-btn.active { background: #3b0a40; border-color: #e879f9; color: #e879f9; }
.mode-btn:hover:not(.active) { color: #c9d1d9; border-color: #6e7681; }

.flag-stage {
  --board: min(480px, calc(100vw - 32px));
  width: var(--board); height: calc(var(--board) * .62);
  display: flex; align-items: center; justify-content: center;
  background: #161b22; border: 1px solid #21262d; border-radius: 14px;
  padding: 16px; margin-bottom: 12px;
}
.flag-stage img {
  max-width: 100%; max-height: 100%; border-radius: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
  animation: pop .3s ease-out;
}
@keyframes pop { from { transform: scale(.94); opacity: 0; } }

.status {
  height: 2.2rem; display: flex; align-items: center; justify-content: center;
  font-size: .95rem; font-weight: 600; color: #8b949e; text-align: center;
}
.status.ok   { color: #e879f9; }
.status.bad  { color: #f87171; }

.answer-row { display: flex; gap: 8px; width: min(480px, calc(100vw - 32px)); margin-bottom: 10px; }
.answer-input {
  flex: 1; min-width: 0; padding: 11px 14px; border-radius: 10px;
  background: #161b22; border: 2px solid #30363d; color: #e6edf3;
  font-size: 1rem; font-family: inherit; transition: border-color .15s;
}
.answer-input:focus { outline: none; border-color: #e879f9; }
.answer-input.shake { animation: shake .35s; border-color: #f87171; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.btn {
  background: #3b0a40; border: 2px solid #e879f9; color: #e879f9;
  padding: 10px 16px; border-radius: 10px; font-size: .88rem; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: background .15s;
}
.btn:hover:not(:disabled) { background: #4a0e50; }
.btn:disabled { opacity: .4; cursor: default; }
.btn-ghost {
  background: none; border: 1px solid #30363d; color: #8b949e;
  padding: 7px 14px; border-radius: 8px; font-size: .8rem; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all .15s;
}
.btn-ghost:hover:not(:disabled) { color: #c9d1d9; border-color: #6e7681; }
.btn-ghost:disabled { opacity: .4; cursor: default; }
.action-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; }

.summary {
  background: #161b22; border: 1px solid #30363d; border-radius: 14px;
  padding: 18px 16px; width: min(600px, calc(100vw - 32px)); margin-bottom: 14px; text-align: center;
}
.summary-title { font-size: 1.3rem; font-weight: 800; color: #e6edf3; margin-bottom: 4px; }
.summary-sub { color: #8b949e; font-size: .85rem; margin-bottom: 14px; }
.review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.review-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.review-item img { width: 100%; aspect-ratio: 3 / 2; object-fit: contain; border-radius: 3px; }
.review-name { font-size: .72rem; line-height: 1.25; }
.review-item.ok   .review-name { color: #e879f9; }
.review-item.help .review-name { color: #fbbf24; }
.review-item.miss .review-name { color: #f87171; }

.footer-row { display: flex; gap: 8px; }
</style>
</head>
<body>
<div id="app" v-cloak>

  <div class="top-bar">
    <a class="back-link" href="index.html">Juegos</a>
  </div>

  <h1>BANDERAS</h1>
  <p class="tagline">¿De qué comunidad autónoma es esta bandera?</p>

  <div class="score-bar">
    <div class="score-item score-ok"><div class="score-label">Bien</div><div class="score-val">{{ counts.ok }}</div></div>
    <div class="score-item score-help"><div class="score-label">Con ayuda</div><div class="score-val">{{ counts.help }}</div></div>
    <div class="score-item score-miss"><div class="score-label">Fallos</div><div class="score-val">{{ counts.miss }}</div></div>
    <div class="score-item score-left"><div class="score-label">Quedan</div><div class="score-val">{{ order.length - idx }}</div></div>
  </div>

  <div class="mode-bar">
    <button class="mode-btn" :class="{active: !strict}" @click="setStrict(false)">Tildes opcionales</button>
    <button class="mode-btn" :class="{active: strict}" @click="setStrict(true)">Tildes obligatorias</button>
  </div>

  <template v-if="!finished">
    <div class="flag-stage">
      <img :key="target" :src="FLAGS[target]" alt="Bandera">
    </div>

    <div class="status" :class="feedback && feedback.kind">{{ feedback ? feedback.text : 'Escribe el nombre de la comunidad' }}</div>

    <form class="answer-row" @submit.prevent="submit">
      <input
        ref="inputEl" v-model="guess" class="answer-input" :class="{shake}"
        autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"
        placeholder="Nombre…" :disabled="locked"
      >
      <button class="btn" type="submit" :disabled="locked || !guess.trim()">Comprobar</button>
    </form>
    <div class="action-row">
      <button class="btn-ghost" @click="hint" :disabled="locked">💡 Pista</button>
      <button class="btn-ghost" @click="reveal" :disabled="locked">Ver respuesta</button>
    </div>
  </template>

  <div v-else class="summary">
    <div class="summary-title">{{ counts.ok }} / {{ order.length }}</div>
    <div class="summary-sub">Récord: {{ best }} / {{ REGIONS.length }} · ¡Ronda completada!</div>
    <div class="review-grid">
      <div v-for="id in order" :key="id" class="review-item" :class="results[id]">
        <img :src="FLAGS[id]" :alt="byId[id].name">
        <span class="review-name">{{ byId[id].name }}</span>
      </div>
    </div>
  </div>

  <div class="footer-row">
    <button class="btn-ghost" @click="newRound">Nueva ronda</button>
    <button class="btn-ghost" @click="resetBest">Borrar récord</button>
  </div>
</div>

const tidy = s => s.toLowerCase().replace(/[^\p{L}]+/gu, ' ').trim();

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const FW_COLORS = ['#e879f9', '#f0abfc', '#c026d3', '#fbbf24', '#f87171', '#facc15'];
function launchFireworks() {
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:200;';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const particles = [];

  function burst(x, y) {
    for (let i = 0; i < 65; i++) {
      const angle = Math.PI * 2 * i / 65;
      const spd   = 2 + Math.random() * 6;
      particles.push({ x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd - 2,
        alpha: 1, color: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)], r: 2 + Math.random() * 3 });
    }
  }

  const end = Date.now() + 3000;
  let lastBurst = 0;
  function frame(now) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (now - lastBurst > 420 && Date.now() < end - 500) {
      burst(canvas.width * (0.2 + Math.random() * 0.6), canvas.height * (0.1 + Math.random() * 0.4));
      lastBurst = now;
    }
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.alpha -= 0.016;
      if (p.alpha <= 0) continue;
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    particles.splice(0, particles.length, ...particles.filter(p => p.alpha > 0));
    if (Date.now() < end || particles.length > 0) requestAnimationFrame(frame);
    else document.body.removeChild(canvas);
  }
  burst(canvas.width * 0.5, canvas.height * 0.35);
  requestAnimationFrame(frame);
}

createApp({
  setup() {
    const strict   = ref(false);
    const order    = ref(shuffle(REGIONS.map(r => r.id)));
    const idx      = ref(0);
    const results  = ref({});
    const best     = ref(0);
    const guess    = ref('');
    const hints    = ref(0);
    const tries    = ref(0);
    const locked   = ref(false);
    const shake    = ref(false);
    const feedback = ref(null);
    const inputEl  = ref(null);

    const byId = Object.fromEntries(REGIONS.map(r => [r.id, r]));
    const finished = computed(() => idx.value >= order.value.length);
    const target = computed(() => finished.value ? null : order.value[idx.value]);

    const counts = computed(() => {
      const c = { ok: 0, help: 0, miss: 0 };
      for (const v of Object.values(results.value)) c[v]++;
      return c;
    });

    function save() {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        order: order.value, idx: idx.value, results: results.value, best: best.value, strict: strict.value,
      }));
    }

    function load() {
      try {
        const s = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (!s) return;
        if (Array.isArray(s.order) && s.order.length === REGIONS.length && s.order.every(id => byId[id])) {
          order.value = s.order;
          idx.value = Math.min(s.idx || 0, s.order.length);
          results.value = s.results || {};
        }
        best.value = s.best || 0;
        strict.value = !!s.strict;
      } catch {}
    }

    function focusInput() {
      nextTick(() => { if (inputEl.value && matchMedia('(hover: hover)').matches) inputEl.value.focus(); });
    }

    function advance(delay) {
      locked.value = true;
      save();
      setTimeout(() => {
        idx.value++;
        guess.value = ''; hints.value = 0; tries.value = 0;
        feedback.value = null; locked.value = false;
        if (finished.value) {
          if (counts.value.ok > best.value) best.value = counts.value.ok;
          if (counts.value.ok === order.value.length) launchFireworks();
        }
        save();
        focusInput();
      }, delay);
    }

    function matches(input, r, keepAccents) {
      const norm = s => tidy(keepAccents ? s : stripAccents(s));
      const g = norm(input);
      return [r.name, ...(r.alt || [])].some(n => norm(n) === g);
    }

    function submit() {
      if (locked.value || !guess.value.trim()) return;
      const r = byId[target.value];
      if (matches(guess.value, r, strict.value)) {
        results.value = { ...results.value, [r.id]: tries.value === 0 && hints.value === 0 ? 'ok' : 'help' };
        feedback.value = { kind: 'ok', text: '✓ ' + r.name };
        advance(1100);
        return;
      }
      tries.value++;
      const nearMiss = strict.value && matches(guess.value, r, false);
      feedback.value = { kind: 'bad', text: nearMiss ? 'Casi — revisa las tildes' : 'No exactamente — inténtalo otra vez' };
      shake.value = false;
      nextTick(() => { shake.value = true; setTimeout(() => { shake.value = false; }, 400); });
    }

    function hint() {
      if (locked.value) return;
      const name = byId[target.value].name;
      hints.value = Math.min(hints.value + 1, name.length);
      guess.value = name.slice(0, hints.value);
      feedback.value = null;
      focusInput();
    }

    function reveal() {
      if (locked.value) return;
      const r = byId[target.value];
      results.value = { ...results.value, [r.id]: 'miss' };
      guess.value = r.name;
      feedback.value = { kind: 'bad', text: 'Era: ' + r.name };
      advance(2200);
    }

    function newRound() {
      order.value = shuffle(REGIONS.map(r => r.id));
      idx.value = 0; results.value = {};
      guess.value = ''; hints.value = 0; tries.value = 0;
      feedback.value = null; locked.value = false;
      save();
      focusInput();
    }

    function resetBest() { best.value = 0; save(); }
    function setStrict(v) { strict.value = v; save(); }

    onMounted(() => { load(); focusInput(); });

    return {
      REGIONS, FLAGS, byId, strict, order, idx, results, best, guess, locked, shake, feedback, inputEl,
      finished, target, counts, submit, hint, reveal, newRound, resetBest, setStrict,
    };
  },
}).mount('#app');
</script>
</body>
</html>
